spring.application.name=alfha-modelhub
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
modelhub.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
modelhub.ollama.model=${OLLAMA_MODEL:qwen3:4b}
modelhub.ollama.timeout=${OLLAMA_TIMEOUT:120s}
