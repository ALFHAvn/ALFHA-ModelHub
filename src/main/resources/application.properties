spring.application.name=alfha-modelhub
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/modelhub}
spring.datasource.username=${DATABASE_USER:modelhub}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.jdbc.template.query-timeout=10s
spring.flyway.enabled=true
modelhub.history.enabled=true
modelhub.benchmark.deployment-id=${MODELHUB_BENCHMARK_DEPLOYMENT_ID:}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
modelhub.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
modelhub.ollama.model=${OLLAMA_MODEL:qwen3:4b}
modelhub.ollama.secondary-model=${OLLAMA_SECONDARY_MODEL:}
modelhub.ollama.timeout=${OLLAMA_TIMEOUT:120s}
modelhub.openrouter.enabled=${OPENROUTER_ENABLED:false}
modelhub.openrouter.model=${OPENROUTER_MODEL:}
modelhub.openrouter.api-key=${OPENROUTER_API_KEY:}
modelhub.openrouter.endpoint=${OPENROUTER_ENDPOINT:https://openrouter.ai/api/v1/chat/completions}
modelhub.openrouter.timeout=${OPENROUTER_TIMEOUT:120s}
